import groovy.xml.XmlParser

plugins {
    id 'com.android.application'
}

// --- shiroikuma-renketsujoka fork: signing ---------------------------------------------------
// Upstream's signing block (further down) reads RELEASE_* from project properties or the
// environment. We feed those from a gitignored keystore.properties instead of touching that
// block, so it never conflicts on a rebase. Absent the file, the release build is unsigned.
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    def keystoreProperties = new Properties()
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    ext.RELEASE_STORE_FILE = keystoreProperties.getProperty('storeFile')
    ext.RELEASE_STORE_PASSWORD = keystoreProperties.getProperty('storePassword')
    ext.RELEASE_KEY_ALIAS = keystoreProperties.getProperty('keyAlias')
    ext.RELEASE_KEY_PASSWORD = keystoreProperties.getProperty('keyPassword')
}

// --- shiroikuma-renketsujoka fork: versioning -------------------------------------------------
// Upstream's versionCode/versionName literals below stay UNTOUCHED so a rebase carries new
// upstream values in by itself; we read them and derive ours. See gradle.properties.
def forkBuildNumber = (project.findProperty('BUILD_NUMBER') ?: '1').toString().toInteger()
def forkPaddedBuildNumber = String.format('%03d', forkBuildNumber)
def forkLastBuiltVersionCode = (project.findProperty('LAST_BUILT_VERSION_CODE') ?: '0').toString().toInteger()
def forkVersionName = null
def forkVersionCode = 0

android {
    namespace 'com.trianguloy.urlchecker'
    defaultConfig {
        applicationId "shiroikuma.renketsujoka"
        compileSdkVersion 36
        minSdkVersion 19
        targetSdkVersion 36
        versionCode 47
        versionName "3.5"
    }

    // Fork: overwrite upstream's two literals with our derived pair.
    //   versionName = "<upstream name>+<BUILD_NUMBER padded to 3>"   e.g. 3.5+001
    //   versionCode = <upstream code> * 10000 + BUILD_NUMBER          e.g. 470001
    forkVersionName = "${defaultConfig.versionName}+${forkPaddedBuildNumber}"
    forkVersionCode = defaultConfig.versionCode * 10000 + forkBuildNumber
    defaultConfig.versionName = forkVersionName
    defaultConfig.versionCode = forkVersionCode

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        alpha {
            initWith(buildTypes.debug)
            applicationIdSuffix '.alpha'
            versionNameSuffix '-ALPHA'
        }
        evaluation {
            initWith(buildTypes.debug)
            applicationIdSuffix '.test'
            versionNameSuffix '-TEST'
        }
    }

    // rename output apks
    applicationVariants.configureEach {
        outputs.configureEach {
            outputFileName = "shiroikuma-renketsujoka_$versionName${name == "release" ? "" : "-$name"}.apk"
        }
    }

    lint {
        // users are free to update translations whenever
        // this mean that they are not usually up to date
        // and that there are usually lots of missing translations
        // so we ignore missing strings
        disable 'MissingTranslation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }

    // https://android.izzysoft.de/articles/named/iod-scan-apkchecks?lang=en#blobs
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// configure signing for release
private String secret(String name) {
    project.hasProperty(name) ? project.property(name) : System.getenv(name)
}

if (secret('RELEASE_STORE_FILE')) {
    println("Secrets provided, release will be signed")
    android {
        signingConfigs {
            release {
                storeFile file(secret('RELEASE_STORE_FILE'))
                storePassword secret('RELEASE_STORE_PASSWORD')
                keyAlias secret('RELEASE_KEY_ALIAS')
                keyPassword secret('RELEASE_KEY_PASSWORD')
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
} else {
    println("No secrets provided, release will not be signed")
}

// Generate translation related fields
android {
    defaultConfig {
        // get translations names
        def folder = file("src/main/res") // from this folder
        def translations = Arrays.stream(folder.list()) // from all files in the folder
                .filter { file("$folder.path/$it/strings.xml").exists() } // and containing a strings translation
                .filter { file("$folder.path/$it/strings.xml").text.contains("<string name=\"locale\">") } // with a valid translation
                .collect { it }

        // generate buildconfig field with all locales
        def locales = translations.stream()
                .map { it.replace('values-', '').replace('-r', '-').replace('values', 'en') } // extract the locale code
                .distinct().sorted() // keep distinct and sort them
                .collect { '"' + it + '"' } // convert as 'string'
                .join(',') // and concatenate with commas
        println "Found locales: $locales"
        buildConfigField "java.util.List<String>", 'LOCALES', "java.util.List.of($locales)"
        // create field

        // generate string resource with all translators
        def translators = translations.stream() // for all translations
                .map { file("$folder.path/$it/strings.xml") } // get the xml file
                .map { new XmlParser().parse(it).find { it.attribute("name") == "translators" }?.text() ?: "" } // extract translators
                .filter { it != "" } // filter empty
                .flatMap { it.split(';').stream() } // split multiple
                .map { it.strip() } // trim
                .filter { it != "白い熊" } // remove myself
                .distinct().sorted() // keep distinct and sort them
                .collect { it }.join(', ') // join with commas
        println "Extracted translators: $translators"
        resValue "string", "all_translators", translators // create resource
    }
}

// --- shiroikuma-renketsujoka fork: buildFork -------------------------------------------------
// Build the signed release APK, copy it to ~/tmp under the house filename, then bump
// BUILD_NUMBER and record the code we just shipped. See .claude/skills/build-apk.
tasks.register('buildFork') {
    description = 'Build the signed release APK, copy it to ~/tmp, and bump BUILD_NUMBER.'
    group = 'build'
    dependsOn 'assembleRelease'

    def releaseApkDir = layout.buildDirectory.dir('outputs/apk/release')
    def propsFile = rootProject.file('gradle.properties')
    def userHome = System.getProperty('user.home')

    doFirst {
        // `master` tracks bleeding upstream/master, whose versionCode stands still between
        // releases — so BUILD_NUMBER never resets. This guard turns the one way that could
        // still go backwards (a hand-edited counter) into a build failure rather than a
        // silent downgrade the installer would refuse.
        if (forkVersionCode <= forkLastBuiltVersionCode) {
            throw new GradleException(
                    "versionCode $forkVersionCode would not exceed the highest already built " +
                            "($forkLastBuiltVersionCode). Raise BUILD_NUMBER past the last built tail.")
        }
    }

    doLast {
        def outputDir = releaseApkDir.get().asFile
        def apk = outputDir.listFiles({ File d, String n -> n.endsWith('.apk') } as FilenameFilter)?.find()
        if (apk == null) throw new GradleException("No APK found in $outputDir")

        def targetDir = new File(userHome, 'tmp')
        targetDir.mkdirs()
        def target = new File(targetDir, "shiroikuma-renketsujoka_${forkVersionName}.apk")
        target.bytes = apk.bytes
        println("[1;36m>>> ${target.absolutePath}[0m")
        println("[1;36m>>> versionCode ${forkVersionCode}[0m")

        def text = propsFile.text
        text = text.replaceFirst(/(?m)^BUILD_NUMBER=\d+$/, "BUILD_NUMBER=${forkBuildNumber + 1}")
        text = text.replaceFirst(/(?m)^LAST_BUILT_VERSION_CODE=\d+$/, "LAST_BUILT_VERSION_CODE=${forkVersionCode}")
        propsFile.text = text
        println("[1;36m>>> BUILD_NUMBER bumped to ${forkBuildNumber + 1}[0m")
    }
}