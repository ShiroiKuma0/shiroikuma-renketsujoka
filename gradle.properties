# === shiroikuma-renketsujoka fork versioning (see app/build.gradle + build-apk skill) ===
# The upstream version pair lives in app/build.gradle as plain literals and is NEVER hand-edited
# here — a rebase onto upstream brings the new values in by itself. BUILD_NUMBER is OUR per-build
# increment: `buildFork` bumps it after every successful build.
#
#   Fork versionName = "<upstream name>+<BUILD_NUMBER padded to 3>"   e.g. 3.5+001
#   Fork versionCode = <upstream code> * 10000 + BUILD_NUMBER          e.g. 470001
#
# BUILD_NUMBER NEVER RESETS. `master` mirrors bleeding upstream/master, whose versionCode stands
# still between upstream releases, so a reset would send our versionCode backwards and every sync
# would read as a downgrade. LAST_BUILT_VERSION_CODE records the highest code ever shipped and
# `buildFork` refuses to build at or below it.
BUILD_NUMBER=12
LAST_BUILT_VERSION_CODE=470011
